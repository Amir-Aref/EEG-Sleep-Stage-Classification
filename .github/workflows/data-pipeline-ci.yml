name: EEG Pipeline CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  contracts-and-tracking:
    name: Phase 2, Phase 3, and MLflow contracts
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      MPLBACKEND: Agg
      PYTHONUTF8: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify project dependencies
        run: |
          python -c "import mne; print('MNE:', mne.__version__)"
          python -c "import numpy, pandas, scipy, sklearn; print('Scientific imports: PASS')"
          python -c "import matplotlib, seaborn, sqlalchemy, joblib; print('Project imports: PASS')"
          python -c "import mlflow; print('MLflow:', mlflow.__version__)"

      - name: Compile Python sources
        run: python -m compileall -q pipeline.py scripts tests

      - name: Validate MLflow configuration and initialize CI tracking store
        run: |
          python scripts/mlflow_tracking.py validate-config
          # Full local artifact validation requires generated dataset artifacts
          # that are intentionally excluded from fresh repository clones.
          python scripts/mlflow_tracking.py init --tracking-root "${RUNNER_TEMP}/eeg-mlflow-ci"

      - name: Run contract tests
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Validate portable Phase 2 pipeline plan
        run: python scripts/run_phase2_pipeline.py --plan
